<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AnalyticsSubtabs - Pulse component source</title>
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="../SegmentedTabs/SegmentedTabs.css" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 48px;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
      }
      .sheet,
      .component-intro,
      .section,
      .states,
      .state {
        display: grid;
      }
      .sheet {
        gap: 30px;
        max-width: 760px;
      }
      .component-intro,
      .section {
        gap: 12px;
      }
      h1,
      p {
        margin: 0;
      }
      h1 {
        font-size: var(--fs-7);
        font-weight: var(--fw-medium);
      }
      p {
        max-width: 64ch;
        color: var(--text-3);
        font-size: var(--fs-4);
        line-height: var(--lh-normal);
      }
      .label,
      .state small {
        color: var(--text-4);
        font-size: var(--fs-1);
        font-weight: var(--fw-semibold);
        letter-spacing: var(--tracking-label);
        text-transform: uppercase;
      }
      .states {
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
      }
      .state {
        gap: 10px;
        justify-items: start;
        padding: 16px;
        border-radius: var(--r-lg);
        background: var(--canvas);
      }
    </style>
  </head>
  <body>
    <main class="sheet">
      <header class="component-intro">
        <h1>AnalyticsSubtabs</h1>
        <p>Two-state review subtab with inline counts and ink active treatment.</p>
      </header>
      <section class="section" aria-label="Analytics subtabs animated component">
        <span class="label">Animated component</span>
        <div
          class="analytics-subtab-switch segmented-tabs"
          role="tablist"
          aria-label="Analytics view"
        >
          <span class="segmented-thumb" aria-hidden="true"></span>
          <button type="button" class="analytics-subtab active" aria-pressed="true">
            Open <span class="analytics-subtab-count">12</span>
          </button>
          <button type="button" class="analytics-subtab" aria-pressed="false">
            Resolved <span class="analytics-subtab-count">8</span>
          </button>
        </div>
      </section>
      <section class="section" aria-label="Analytics subtab slices">
        <span class="label">Slices</span>
        <div class="states">
          <div class="state">
            <small>Open active</small>
            <div
              class="analytics-subtab-switch segmented-tabs"
              role="tablist"
              aria-label="Open active"
            >
              <span class="segmented-thumb" aria-hidden="true"></span>
              <button type="button" class="analytics-subtab active" aria-pressed="true">
                Open <span class="analytics-subtab-count">12</span>
              </button>
              <button type="button" class="analytics-subtab" aria-pressed="false">
                Resolved <span class="analytics-subtab-count">8</span>
              </button>
            </div>
          </div>
          <div class="state">
            <small>Resolved active</small>
            <div
              class="analytics-subtab-switch segmented-tabs"
              role="tablist"
              aria-label="Resolved active"
            >
              <span class="segmented-thumb" aria-hidden="true"></span>
              <button type="button" class="analytics-subtab" aria-pressed="false">
                Open <span class="analytics-subtab-count">12</span>
              </button>
              <button type="button" class="analytics-subtab active" aria-pressed="true">
                Resolved <span class="analytics-subtab-count">8</span>
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script src="../SegmentedTabs/SegmentedTabs.js"></script>
  </body>
</html>
