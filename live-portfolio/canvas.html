<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canvas — Vicino AI</title>
  <meta name="description" content="A working, dependency-free replica of Canvas — the node editor I helped build at Vicino AI. Pan, zoom, wire nodes, run the graph. Generation is simulated; no backend, no credits." />
  <meta name="robots" content="noindex" />

  <link rel="icon" type="image/png" href="Media/darkcircle.png" />
  <meta name="theme-color" content="#eef3f3" />
  <link rel="apple-touch-icon" href="Media/apple-touch-icon.png" />
  <!-- the board's design IS Manrope (pulse-overrides.css) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap" />
  <link rel="stylesheet" href="css/vicino-canvas.css?v=16" />
  <style>
    /* THE APP, NOT A PICTURE OF IT. On the case study the board is a
       1920×1080 object scaled into a tile; here it simply IS the window:
       fixed to all four edges, no frame, no radius, no shadow, no page
       around it. That also makes the rendered scale exactly 1, which is
       the scale the shipped editor's own pointer math assumes — nothing
       is inferred, nothing is compensated for. */
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #eef3f3;
      overscroll-behavior: none;
    }
    #vc.vc {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }
  </style>
  <!-- "Not me." Vercel hands every beacon to a beforeSend hook before it
       sends, and drops it outright when that hook returns null — so this is a
       real opt-out, not a send-then-discard: nothing leaves the browser.
       Load ?va-ignore=1 once on a machine to go quiet on it, ?va-ignore=0 to
       start counting again. The flag is localStorage, so it is per browser
       profile — each browser you read this site in needs its own visit, and
       clearing site data forgets it. The param strips itself so the URL you
       are left holding is the ordinary one. -->
  <script>
    (() => {
      try {
        const q = new URLSearchParams(location.search);
        if (q.has('va-ignore')) {
          const on = q.get('va-ignore') !== '0';
          if (on) localStorage.setItem('va.ignore', '1');
          else localStorage.removeItem('va.ignore');
          q.delete('va-ignore');
          const rest = q.toString();
          history.replaceState(null, '',
            location.pathname + (rest ? '?' + rest : '') + location.hash);
          console.log('[analytics] this browser is now ' + (on ? 'IGNORED' : 'counted'));
        }
        if (localStorage.getItem('va.ignore')) {
          (window.vaq = window.vaq || []).push(['beforeSend', () => null]);
        }
      } catch (e) { /* private mode, blocked storage: just count normally */ }
    })();
  </script>
  <!-- Vercel Web Analytics. First-party and cookieless: the script is served
       from this same origin at deploy time, so there is no third party in the
       page, nothing for a blocker to catch, and no consent banner owed. -->
  <script defer src="/_vercel/insights/script.js"></script>
</head>

<body>
  <div class="vc" id="vc" role="application"
       aria-label="Canvas — a working replica of Vicino AI's node editor"></div>

  <script src="js/vicino-canvas.js?v=29"></script>
  <script>
    (() => {
      if (!window.VicinoCanvas) return;
      // the board renders at 1:1 in a window it fills — say so outright,
      // so the engine's pointer math never has to infer a scale
      window.VicinoCanvas.setStageScale(1);
      // this tab IS the instrument: the board owns the input from the
      // first frame, and attract mode never runs here
      window.VicinoCanvas.setTheater(true);
      // the framing follows the window, since the window is the board now
      window.addEventListener('resize', () => window.VicinoCanvas.fit(), { passive: true });
      // a tab that opened in the background had no box to frame against
      window.addEventListener('load', () => window.VicinoCanvas.fit());

      // Escape walks inward-out through the board's own layers (menus,
      // chat, selection). There is nothing outside it to close.
      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return;
        if (window.VicinoCanvas.handleEscape()) e.preventDefault();
      }, true);
    })();
  </script>
</body>
</html>
