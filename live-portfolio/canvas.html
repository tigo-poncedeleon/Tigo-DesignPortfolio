<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canvas — Vicino AI</title>
  <meta name="description" content="A working, dependency-free replica of Canvas — the node editor I helped build at Vicino AI. Pan, zoom, wire nodes, run the graph. Generation is simulated; no backend, no credits." />
  <meta name="robots" content="noindex" />

  <link rel="icon" type="image/png" href="Media/darkcircle.png" />
  <meta name="theme-color" content="#eef3f3" />
  <link rel="apple-touch-icon" href="Media/apple-touch-icon.png" />
  <!-- the board's design IS Manrope (pulse-overrides.css) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap" />
  <link rel="stylesheet" href="css/vicino-canvas.css?v=11" />
  <style>
    /* THE APP, NOT A PICTURE OF IT. On the case study the board is a
       1920×1080 object scaled into a tile; here it simply IS the window:
       fixed to all four edges, no frame, no radius, no shadow, no page
       around it. That also makes the rendered scale exactly 1, which is
       the scale the shipped editor's own pointer math assumes — nothing
       is inferred, nothing is compensated for. */
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #eef3f3;
      overscroll-behavior: none;
    }
    #vc.vc {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }
    /* the one thing the product has no reason to carry: a way back. It
       reads as a crumb under the board's title — the only spot no piece
       of the board's own chrome ever reaches at any width (the rail is
       vertically centred, the panel is right, the minimap and toolbar
       are bottom) — and it stays quiet until you look for it. */
    .solo-back {
      position: fixed;
      left: 22px;
      top: 56px;
      z-index: 20;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 32px;
      padding: 0 13px;
      border-radius: 9999px;
      background: #fff;
      border: 1px solid rgba(15, 23, 42, 0.12);
      box-shadow: 0px 4px 14px rgba(15, 23, 42, 0.08);
      font: 500 12px/1 "Manrope", ui-sans-serif, system-ui, -apple-system,
        "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #44464a;
      text-decoration: none;
      opacity: 0.42;
      transition: opacity 0.2s ease, color 0.2s ease;
    }
    .solo-back:hover,
    .solo-back:focus-visible { opacity: 1; color: #0d7685; }
    .solo-back svg { width: 12px; height: 12px; }
    @media (max-width: 700px) {
      .solo-back { left: 12px; top: 50px; }
    }
  </style>
</head>

<body>
  <div class="vc" id="vc" role="application"
       aria-label="Canvas — a working replica of Vicino AI's node editor"></div>

  <a class="solo-back" href="vicino.html#canvas">
    <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M7.5 2.5 L4 6 L7.5 9.5" />
    </svg>
    the case study
  </a>

  <script src="js/vicino-canvas.js?v=27"></script>
  <script>
    (() => {
      if (!window.VicinoCanvas) return;
      // the board renders at 1:1 in a window it fills — say so outright,
      // so the engine's pointer math never has to infer a scale
      window.VicinoCanvas.setStageScale(1);
      // this tab IS the instrument: the board owns the input from the
      // first frame, and attract mode never runs here
      window.VicinoCanvas.setTheater(true);
      // the framing follows the window, since the window is the board now
      window.addEventListener('resize', () => window.VicinoCanvas.fit(), { passive: true });
      // a tab that opened in the background had no box to frame against
      window.addEventListener('load', () => window.VicinoCanvas.fit());

      // Escape walks inward-out through the board's own layers (menus,
      // chat, selection). There is nothing outside it to close.
      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return;
        if (window.VicinoCanvas.handleEscape()) e.preventDefault();
      }, true);
    })();
  </script>
</body>
</html>
