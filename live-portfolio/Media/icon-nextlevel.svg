<!-- Next Level Drone Cleaning, reduced to the one thing that survives 28px:
     a top-down quadcopter. Four rotors, an X frame, a body, nothing else.
     The full roundel (Media/NextLevelIcon.webp) still carries the wordmark on
     the work stage; this is only ever the chip in the index.
     Azure is the brand's own nl-azure token, css/nextlevel.css:21.
     Master for icon-nextlevel.webp: rsvg-convert -w 256 -h 256, then cwebp.
     Do NOT render this with ImageMagick: its internal SVG renderer drops
     stroked paths and the frame comes out missing. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#2b7cc4"/>
  <path d="M168 168 L344 344 M344 168 L168 344"
        stroke="#fff" stroke-width="46" stroke-linecap="round" fill="none"/>
  <g fill="#fff">
    <circle cx="146" cy="146" r="62"/><circle cx="366" cy="146" r="62"/>
    <circle cx="146" cy="366" r="62"/><circle cx="366" cy="366" r="62"/>
    <rect x="196" y="196" width="120" height="120" rx="34"/>
  </g>
</svg>
