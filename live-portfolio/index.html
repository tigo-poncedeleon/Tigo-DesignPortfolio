  <!-- set before first paint so the chrome and sidebar are already held at
       opacity 0 when they are built — the intro has no flash to hide -->
  <script>
    document.documentElement.className += ' js' +
      (sessionStorage.getItem('shell.intro') ? '' : ' intro-pending');
  </script>
</head>

<body>
  <!-- The mini browser: chrome strip + sidebar + content card. The six
       wrapper elements are the ONLY shell markup that lives in this file;
       everything inside them is generated by js/shell.js, so there is one
       source of truth across the nine pages. -->
  <div class="shell" id="shell" data-page="home" data-title="Home">
    <header class="shell-chrome" id="shell-chrome"></header>
    <div class="shell-body">
      <aside class="shell-side" id="shell-side"></aside>
      <div class="shell-card" id="shell-card">
  <main>
    <!-- The home card holds the name pair and nothing else. The pill of
         words retired with the cover frame — the sidebar is the nav now —
         so the one thing that happens on arrival is that the name writes
         itself (js/typewriter.js).

         Each line is a grid: a hidden ghost copy reserves the full width
         from frame one, so the centred header cannot drift while it types.
         The .sr-only copy is what assistive tech reads; the animated span
         is decoration. -->
    <section id="stage" class="stage">
      <header class="frame-top" id="type-head">
        <h1 class="frame-name tw-line">
          <span class="sr-only">Tigo Ponce de León</span>
          <span class="tw-ghost" aria-hidden="true">Tigo Ponce de León</span>
          <span class="tw" data-text="Tigo Ponce de León" aria-hidden="true"
            ><i class="tw-caret" id="tw-caret"></i></span>
        </h1>
        <p class="frame-role tw-line">
          <span class="sr-only">product design engineer</span>
          <span class="tw-ghost" aria-hidden="true">product design engineer</span>
          <span class="tw" data-text="product design engineer" aria-hidden="true"></span>
        </p>
      </header>
    </section>
  </main>
      </div>
    </div>
  </div>

  <!-- MOBILE ONLY: the shared site-nav bottom bar (styles.css). It stays a
       direct child of <body>, OUTSIDE the shell — a position:fixed element
       inside a transformed ancestor is positioned against the ancestor,
       not the viewport. On desktop the sidebar is the nav and this hides. -->
  <nav class="site-nav" aria-label="Site">
    <a class="site-nav-home" href="index.html#home" aria-label="Home">
      <img src="Media/pong-house.svg" alt="" width="32" height="28" />
    </a>
    <div class="site-nav-reveal">
      <div class="site-nav-words">
        <a class="site-nav-word is-home is-current" aria-current="page" href="index.html#home">home</a>
        <a class="site-nav-word" href="about.html">about</a>
        <a class="site-nav-word" href="work.html">work</a>
        <a class="site-nav-word" href="play.html">play</a>
        <a class="site-nav-word" href="ai.html">ai</a>
      </div>
    </div>
  </nav>

  <script src="js/portrait.js?v=6"></script>
  <script src="js/tabs.js?v=3"></script>

  <script src="js/globe.js?v=3"></script>

  <script src="js/nav-touch.js?v=2"></script>
  <script src="js/main.js?v=2"></script>
  <script src="js/ai-chat.js?v=4"></script>
</body>
</html>
