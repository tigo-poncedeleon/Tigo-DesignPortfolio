<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tigo Ponce de León</title>

  <link rel="icon" type="image/png" href="Media/darkcircle.png" />
  <meta name="description" content="Product design engineer studying Media Arts & Design and Computer Science at the University of Chicago. Selected work, playable games, and an AI to ask about him." />
  <meta name="theme-color" content="#fdfdfd" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Tigo Ponce de León" />
  <meta property="og:title" content="Tigo Ponce de León" />
  <meta property="og:description" content="Product design engineer studying Media Arts & Design and Computer Science at the University of Chicago. Selected work, playable games, and an AI to ask about him." />
  <meta property="og:url" content="https://tigoponcedeleon.com/" />
  <meta property="og:image" content="https://tigoponcedeleon.com/Media/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="apple-touch-icon" href="Media/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/styles.css?v=33" />
  <link rel="stylesheet" href="css/shell.css?v=1" />
</head>

<body>
  <!-- The mini browser: chrome strip + sidebar + content card. The six
       wrapper elements are the ONLY shell markup that lives in this file;
       everything inside them is generated by js/shell.js, so there is one
       source of truth across the nine pages. -->
  <div class="shell" id="shell" data-page="home" data-title="Home">
    <header class="shell-chrome" id="shell-chrome"></header>
    <div class="shell-body">
      <aside class="shell-side" id="shell-side"></aside>
      <div class="shell-card" id="shell-card">
  <main>
    <!-- The stage opens on the COVER frame (Figma 1408:28): name + role
         dead-centre and the arrow below. Clicking the arrow or any scroll
         gesture removes is-cover (js/home-open.js) and the page settles
         into the nav frame (1401:112). One-way. -->
    <section id="stage" class="stage is-cover">
      <!-- top: name + role -->
      <header class="frame-top">
        <h1 class="frame-name">Tigo Ponce de León</h1>
        <p class="frame-role">product design engineer</p>
      </header>

      <!-- centre: the pill of words + the grey chip that rides UNDER the hovered
           word (moved and resized by glass-nav.js). The chip is declared first so
           it paints behind the words, matching Figma's node order. -->
      <div class="pill" id="pill">
        <div class="glass" id="glass" aria-hidden="true"></div>
        <!-- real links (crawlable, cmd-clickable); glass-nav.js only drives
             the chip and the touch first-tap-preview behavior -->
        <div class="words" id="words">
          <a class="word" href="about.html" data-word="about">about</a>
          <a class="word" href="work.html" data-word="work">work</a>
          <a class="word" href="play.html" data-word="play">play</a>
          <a class="word" href="ai.html" data-word="ai">ai</a>
        </div>
      </div>

      <!-- bottom: current state + live local time -->
      <footer class="frame-bottom">
        <p class="frame-state" data-clock="state">Oregon</p>
        <p class="frame-time" data-clock="time">--:--:-- --</p>
      </footer>

      <!-- cover-frame arrow (Figma 1408:40: arrow.up.circle, 39×39 @ 620,742) -->
      <button class="open-arrow" id="open-arrow" type="button" aria-label="Enter site">
        <svg width="39" height="39" viewBox="0 0 39 39" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
            <circle cx="19.5" cy="19.5" r="17.2" />
            <path d="M19.5 27 V13" />
            <path d="M13 19 L19.5 12.5 L26 19" stroke-linejoin="round" />
          </g>
        </svg>
      </button>
    </section>
  </main>
      </div>
    </div>
  </div>

  <!-- MOBILE ONLY: the shared site-nav bottom bar (styles.css). It stays a
       direct child of <body>, OUTSIDE the shell — a position:fixed element
       inside a transformed ancestor is positioned against the ancestor,
       not the viewport. On desktop the sidebar is the nav and this hides. -->
  <nav class="site-nav" aria-label="Site">
    <a class="site-nav-home" href="index.html#home" aria-label="Home">
      <img src="Media/pong-house.svg" alt="" width="32" height="28" />
    </a>
    <div class="site-nav-reveal">
      <div class="site-nav-words">
        <a class="site-nav-word is-home is-current" aria-current="page" href="index.html#home">home</a>
        <a class="site-nav-word" href="about.html">about</a>
        <a class="site-nav-word" href="work.html">work</a>
        <a class="site-nav-word" href="play.html">play</a>
        <a class="site-nav-word" href="ai.html">ai</a>
      </div>
    </div>
  </nav>

  <script src="js/shell.js?v=1"></script>
  <script src="js/stage-fit.js?v=2"></script>
  <script src="js/frame-clock.js?v=2"></script>
  <script src="js/glass-nav.js?v=10"></script>
  <script src="js/home-open.js"></script>
  <script src="js/nav-touch.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
