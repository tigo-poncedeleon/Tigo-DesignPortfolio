<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tigo Ponce de León — AI</title>
  <!-- The AI is an overlay now, not a page of its own. This file survives so
       the OG card, nav-touch's icon map and every external link still land
       somewhere sensible: the one page, with the sheet already open. ?q= is
       carried through so a seeded question still works. -->
  <link rel="canonical" href="https://tigoponcedeleon.com/" />
  <meta name="robots" content="noindex" />
  <script>
    var q = new URLSearchParams(location.search).get('q');
    location.replace('index.html?ask=1' + (q ? '&q=' + encodeURIComponent(q) : ''));
  </script>
  <meta http-equiv="refresh" content="0; url=index.html?ask=1" />
</head>
<body><p>Taking you to <a href="index.html?ask=1">tigoponcedeleon.com</a>…</p></body>
</html>
