<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640">
  <!-- 04 At work: eighteen screens, redrawn on-system. The eighteen in the
       back, eleven ticked; the twelfth's slot empty, because it is the one
       on the desk, half inked; and the agent with the pen, in the
       chapter's blue -->
  <style>
    .p { stroke: #1d1d1f; stroke-width: 6; stroke-linejoin: round; stroke-linecap: round; }
    .q { stroke: #1d1d1f; stroke-width: 4.5; stroke-linejoin: round; stroke-linecap: round; }
    .q:not([fill]) { fill: none; }
    .hand { font-family: 'Chalkboard SE', 'Noteworthy', cursive; fill: #1d1d1f; }
    .sans { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <filter id="hand" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="37" />
      <feDisplacementMap in="SourceGraphic" scale="3" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="10" /></filter>
  </defs>

  <g fill="#1c6f78" opacity="0.18" filter="url(#lift)">
    <rect x="146" y="318" width="296" height="250" rx="22" />
    <rect x="558" y="370" width="100" height="90" rx="18" />
  </g>

