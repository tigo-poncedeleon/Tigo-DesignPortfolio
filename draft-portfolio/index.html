<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tigo Ponce de León</title>

  <link rel="icon" type="image/png" href="Media/face_cutout.png" />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <!-- ===== PHASE 1: Curtain intro (fixed overlay) ===== -->
  <div id="curtain" class="curtain" aria-hidden="true">
    <!-- USA-only flag word-art, populated by geo-clock.js -->
    <div id="flag-grid" class="flag-grid"></div>

    <!-- middle-left: city + live local time -->
    <div class="curtain-info">
      <div id="geo-place" class="geo-place">&nbsp;</div>
      <div id="geo-clock" class="geo-clock">&nbsp;</div>
    </div>

    <!-- stick figure at the curtain's right edge, pushes the curtain left -->
    <div id="stick-figure" class="stick-figure">
      <svg viewBox="0 0 90 230" width="90" height="230" fill="none"
           stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true">
        <circle cx="45" cy="34" r="30" />
        <line x1="45" y1="64" x2="45" y2="150" />
        <!-- pushing arm (left) + trailing arm -->
        <line class="arm-push" x1="45" y1="92" x2="6" y2="112" />
        <line x1="45" y1="92" x2="74" y2="118" />
        <!-- legs -->
        <line x1="45" y1="150" x2="14" y2="222" />
        <line x1="45" y1="150" x2="78" y2="214" />
      </svg>
    </div>
  </div>

  <!-- ===== Custom cursor (top-most) ===== -->
  <div id="cursor" class="cursor" aria-hidden="true">
    <svg viewBox="0 0 16 21" width="16" height="21" aria-hidden="true">
      <path d="M1 1 L15 11 L7.2 12.4 L4.6 20 Z" fill="#000000" stroke="#ffffff" stroke-width="1"
            stroke-linejoin="round" />
    </svg>
  </div>

  <!-- ===== PHASES 2-4: one pinned stage ===== -->
  <main>
    <section id="stage" class="stage">
      <!-- Phase 2: landing -->
      <div id="landing" class="landing">
        <div class="portrait-wrap">
          <canvas id="head-canvas" class="center-image"></canvas>
          <img src="Media/face_cutout.png" alt="Portrait of Tigo" class="center-image mobile-face" />
        </div>
        <h1 class="split name" data-text="Tigo Ponce de León"></h1>
        <p class="split subtitle" data-text="product design engineer"></p>
      </div>

      <!-- Phase 4: nav page (same center, hidden until scroll assembles it) -->
      <nav id="nav-page" class="nav-page" aria-hidden="true">
        <span class="navword" data-emoji="👋">about</span>
        <span class="navword" data-emoji="✍️">work</span>
        <span class="navword" data-emoji="🤟">play</span>
        <span class="navword" data-emoji="🖖">ai</span>
      </nav>
    </section>
  </main>

  <!-- ===== Libraries (CDN) ===== -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Portrait: ported verbatim; self-boots, needs THREE + #head-canvas -->
  <script src="js/line-portrait.js"></script>

  <!-- Phase modules (each exposes one init fn on window) -->
  <script src="js/geo-clock.js"></script>
  <script src="js/curtain.js"></script>
  <script src="js/custom-cursor.js"></script>
  <script src="js/text-sway.js"></script>
  <script src="js/scroll-transition.js"></script>
  <script src="js/nav-hover.js"></script>

  <!-- Orchestrator (runs last) -->
  <script src="js/main.js"></script>
</body>
</html>
