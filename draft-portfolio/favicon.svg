<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- a disc of the page's ink, the name's #444343. On a dark tab bar it
       takes night's ink instead, so it doesn't sink into the dark. -->
  <style>
    circle { fill: #444343; }
    @media (prefers-color-scheme: dark) { circle { fill: #e4e4e6; } }
  </style>
  <circle cx="16" cy="16" r="15" />
</svg>
